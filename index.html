<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stormforge Bench — Aesir sentient axe</title>
<style>
  :root{
    --abyss:#05070f; --iron:#0d1526; --iron2:#121d33;
    --arc:#57e0ff; --disch:#b98cff; --forge:#ffe9a3; --frost:#e8eef8;
    --dim:#5f7391;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--abyss);color:var(--frost);
    font-family:var(--sans);overflow:hidden;overscroll-behavior:none}
  #cv{position:fixed;inset:0;display:block;touch-action:none}

  #flash{position:fixed;inset:0;pointer-events:none;background:#dff4ff;opacity:0;
    mix-blend-mode:screen;transition:opacity .09s linear;z-index:5}

  .plate{position:fixed;z-index:10;background:linear-gradient(180deg,rgba(13,21,38,.93),rgba(6,10,20,.93));
    border:1px solid rgba(87,224,255,.19);border-radius:3px;
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}

  /* ---- masthead ---- */
  #head{top:10px;left:10px;padding:9px 13px 10px}
  #head .eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.24em;
    color:var(--arc);text-transform:uppercase;display:flex;gap:7px;align-items:center}
  #head .eyebrow b{width:5px;height:5px;background:var(--arc);border-radius:50%;
    box-shadow:0 0 8px var(--arc);animation:pip 1.9s ease-in-out infinite}
  @keyframes pip{50%{opacity:.25}}
  #head h1{margin:4px 0 0;font-size:19px;font-weight:900;letter-spacing:-.025em;
    text-transform:uppercase;line-height:1}
  #head p{margin:3px 0 0;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.02em}

  /* ---- attack rail ---- */
  #rail{left:10px;bottom:10px;padding:8px;display:flex;flex-direction:column;gap:6px;width:190px}
  .railcap{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--dim);
    text-transform:uppercase;padding:1px 3px 4px}
  button.mv{appearance:none;cursor:pointer;text-align:left;
    background:linear-gradient(180deg,var(--iron2),#0a1220);
    border:1px solid rgba(87,224,255,.22);border-left:2px solid var(--arc);
    border-radius:2px;color:var(--frost);padding:7px 9px;
    font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.01em;
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    transition:background .12s,border-color .12s,transform .06s}
  button.mv span{font-family:var(--mono);font-size:9px;color:var(--arc);
    letter-spacing:.06em;font-weight:400;white-space:nowrap}
  button.mv:hover{background:linear-gradient(180deg,#1a2947,#0d1729);border-color:rgba(87,224,255,.5)}
  button.mv:active{transform:translateX(2px)}
  button.mv:focus-visible{outline:2px solid var(--forge);outline-offset:2px}
  button.mv.ult{border-left-color:var(--disch)}
  button.mv.ult span{color:var(--disch)}

  /* ---- telemetry ---- */
  #tel{top:10px;right:10px;padding:9px 11px;width:186px;font-family:var(--mono);font-size:10px}
  #tel .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;color:var(--dim)}
  #tel .row b{color:var(--frost);font-weight:400}
  #tel .row.hi b{color:var(--arc)}
  #tel hr{border:0;border-top:1px solid rgba(87,224,255,.14);margin:6px 0}
  #tel .mood{color:var(--forge);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  #bars{display:flex;gap:2px;margin-top:5px;height:16px;align-items:flex-end}
  #bars i{flex:1;background:var(--arc);opacity:.5;height:20%;border-radius:1px}

  /* ---- tuning ---- */
  #tune{right:10px;bottom:10px;padding:8px 11px 10px;width:186px}
  #tune label{display:block;font-family:var(--mono);font-size:9px;color:var(--dim);
    letter-spacing:.12em;text-transform:uppercase;margin:7px 0 2px;
    display:flex;justify-content:space-between}
  #tune label i{color:var(--arc);font-style:normal}
  #tune input[type=range]{width:100%;height:16px;appearance:none;background:transparent;margin:0}
  #tune input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(87,224,255,.28)}
  #tune input[type=range]::-webkit-slider-thumb{appearance:none;width:11px;height:11px;
    margin-top:-5px;border-radius:50%;background:var(--arc);box-shadow:0 0 7px rgba(87,224,255,.8)}
  #tune input[type=range]::-moz-range-track{height:2px;background:rgba(87,224,255,.28)}
  #tune input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--arc)}
  #tune input[type=range]:focus-visible{outline:2px solid var(--forge);outline-offset:3px}
  #tune .dump{margin-top:9px;width:100%;cursor:pointer;background:transparent;
    border:1px dashed rgba(255,233,163,.4);color:var(--forge);border-radius:2px;
    font-family:var(--mono);font-size:9px;letter-spacing:.14em;padding:5px;text-transform:uppercase}
  #tune .dump:hover{background:rgba(255,233,163,.08)}

  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;
    font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em;
    pointer-events:none;text-align:center}

  @media (max-width:900px){
    #tune{display:none}
    #tel{width:150px;font-size:9px}
    #rail{width:158px}
    button.mv{font-size:11px;padding:6px 8px}
    button.mv span{display:none}
    #head h1{font-size:15px}
  }
  @media (prefers-reduced-motion:reduce){
    #head .eyebrow b{animation:none}
    #flash{display:none}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="flash"></div>

<div class="plate" id="head">
  <div class="eyebrow"><b></b>Stormforge bench · live</div>
  <h1>Aesir — sentient axe</h1>
  <p>Projected weapon · spring-driven companion</p>
</div>

<div class="plate" id="tel">
  <div class="row hi"><span>fps</span><b id="tFps">—</b></div>
  <div class="row"><span>draw objects</span><b id="tObj">—</b></div>
  <div class="row"><span>live bolts</span><b id="tBolt">—</b></div>
  <hr>
  <div class="row"><span>temperament</span></div>
  <div class="mood" id="tMood">DORMANT</div>
  <div id="bars"></div>
  <hr>
  <div class="row"><span>axe scale</span><b id="tScale">1.00×</b></div>
  <div class="row"><span>lag from anchor</span><b id="tLag">0.00</b></div>
  <div class="row"><span>charge</span><b id="tChg">0%</b></div>
</div>

<div class="plate" id="rail">
  <div class="railcap">Provoke</div>
  <button class="mv" data-mv="arc">Arc Slash <span>fast</span></button>
  <button class="mv" data-mv="cleave">Thunder Cleave <span>2.2× grow</span></button>
  <button class="mv" data-mv="chain">Chain Lightning <span>5 links</span></button>
  <button class="mv" data-mv="orbit">Storm Orbit <span>4s</span></button>
  <button class="mv ult" data-mv="ragnarok">Ragnarok <span>5× ult</span></button>
</div>

<div class="plate" id="tune">
  <div class="railcap">Tune the feel</div>
  <label>Hover distance <i id="vRad">1.15</i></label>
  <input type="range" id="sRad" min="0.6" max="2.2" step="0.05" value="1.15">
  <label>Spring stiffness <i id="vStiff">46</i></label>
  <input type="range" id="sStiff" min="8" max="120" step="1" value="46">
  <label>Damping <i id="vDamp">7.0</i></label>
  <input type="range" id="sDamp" min="2" max="20" step="0.2" value="7">
  <label>Energy intensity <i id="vInt">1.00</i></label>
  <input type="range" id="sInt" min="0.3" max="2.2" step="0.05" value="1">
  <label>Base axe scale <i id="vScl">1.00</i></label>
  <input type="range" id="sScl" min="0.5" max="2" step="0.05" value="1">
  <button class="dump" id="dump">Copy tuning values</button>
</div>

<div id="hint">drag to orbit · tap a move to provoke it</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.128.0/three.min.js"></script>

function b64ToBuf(b64){
  const bin=atob(b64), n=bin.length, u=new Uint8Array(n);
  for(let i=0;i<n;i++)u[i]=bin.charCodeAt(i);
  return u.buffer;
}

/* =====================================================================
   THE AXE — projected energy, not a solid object.
   Three layers share one BufferGeometry:
     core   translucent body with energy bands flowing up the shaft
     halo   back-faces only, scaled out, for volumetric bloom
     ghost  wireframe, sells "projection" rather than "prop"
   All additive with depthWrite off, so they never sort against each other.
   ===================================================================== */
const axeRig=new THREE.Group();   // hover + spring position
const axeSpin=new THREE.Group();  // orientation / personality
const axeScale=new THREE.Group(); // growth
axeRig.add(axeSpin); axeSpin.add(axeScale); scene.add(axeRig);

const axeGeo=new THREE.BufferGeometry();
axeGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(b64ToBuf(AXE_POS_B64)),3));
axeGeo.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(b64ToBuf(AXE_NRM_B64)),3));
axeGeo.setIndex(new THREE.BufferAttribute(new Uint16Array(b64ToBuf(AXE_IDX_B64)),1));
axeGeo.computeBoundingSphere();

const ENERGY_VERT=`
varying vec3 vN; varying vec3 vV; varying vec3 vP;
void main(){
  vec4 wp=modelMatrix*vec4(position,1.0);
  vN=normalize(mat3(modelMatrix)*normal);
  vV=normalize(cameraPosition-wp.xyz);
  vP=position;
  gl_Position=projectionMatrix*viewMatrix*wp;
}`;
const ENERGY_FRAG=`
uniform float uTime,uIntensity,uCharge,uAlpha,uRimPow,uBandAmp;
uniform vec3 uCore,uRim;
varying vec3 vN; varying vec3 vV; varying vec3 vP;
void main(){
  float f=1.0-clamp(dot(normalize(vN),normalize(vV)),0.0,1.0);
  float rim=pow(f,uRimPow);
  // energy travelling up the shaft into the head
  float band=sin(vP.y*15.0-uTime*7.0)*0.5+0.5;
  band=pow(band,3.0)*uBandAmp;
  // fine interference scan, reads as a projection artefact
  float scan=sin(vP.y*120.0+uTime*17.0)*0.5+0.5;
  vec3 col=uCore*(0.22+0.6*band)+uRim*rim*2.3+uRim*scan*0.10;
  col*=uIntensity*(0.8+0.75*uCharge);
  float a=clamp(rim*0.9+band*0.32+0.14,0.0,1.0)*uAlpha;
  gl_FragColor=vec4(col,a);
}`;

function energyMat(o){
  return new THREE.ShaderMaterial({
    uniforms:{
      uTime:{value:0}, uIntensity:{value:1}, uCharge:{value:0},
      uAlpha:{value:o.alpha}, uRimPow:{value:o.rimPow}, uBandAmp:{value:o.band},
      uCore:{value:new THREE.Color(o.core)}, uRim:{value:new THREE.Color(o.rim)}
    },
    vertexShader:ENERGY_VERT, fragmentShader:ENERGY_FRAG,
    transparent:true, blending:THREE.AdditiveBlending,
    depthWrite:false, depthTest:true, side:o.side
  });
}
const matCore=energyMat({alpha:1.0,rimPow:2.1,band:1.0,core:0x1c7fd4,rim:0xa8ecff,side:THREE.DoubleSide});
const matHalo=energyMat({alpha:0.40,rimPow:1.25,band:0.5,core:0x2a4fd0,rim:0x7fd4ff,side:THREE.BackSide});

const axeCore=new THREE.Mesh(axeGeo,matCore); axeScale.add(axeCore);
const axeHalo=new THREE.Mesh(axeGeo,matHalo); axeHalo.scale.setScalar(1.13); axeScale.add(axeHalo);
const axeGhost=new THREE.LineSegments(
  new THREE.WireframeGeometry(axeGeo),
  new THREE.LineBasicMaterial({color:0x9fe8ff,transparent:true,opacity:.14,
    blending:THREE.AdditiveBlending,depthWrite:false}));
axeGhost.scale.setScalar(1.005); axeScale.add(axeGhost);

/* =====================================================================
   LIGHTNING — pooled polylines. Fixed vertex budget, no allocation
   during play. Each bolt is displaced off the straight line by two
   sine octaves with a per-bolt random phase, tapered at both ends.
   ===================================================================== */
const BOLT_SEGS=26, BOLT_POOL=26;
const bolts=[];
for(let i=0;i<BOLT_POOL;i++){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(BOLT_SEGS*3),3));
  const m=new THREE.LineBasicMaterial({color:0xbdf0ff,transparent:true,opacity:0,
    blending:THREE.AdditiveBlending,depthWrite:false});
  const l=new THREE.Line(g,m); l.frustumCulled=false; l.visible=false; scene.add(l);
  bolts.push({line:l,mat:m,geo:g,life:0,max:1,amp:1});
}
let boltCursor=0, liveBolts=0;
const _pa=new THREE.Vector3(), _pb=new THREE.Vector3(), _d=new THREE.Vector3(),
      _u=new THREE.Vector3(), _v=new THREE.Vector3(), _up=new THREE.Vector3(0,1,0);

function fireBolt(ax,ay,az,bx,by,bz,amp,life,color){
  const b=bolts[boltCursor]; boltCursor=(boltCursor+1)%BOLT_POOL;
  _pa.set(ax,ay,az); _pb.set(bx,by,bz);
  _d.subVectors(_pb,_pa);
  _u.crossVectors(_d,_up); if(_u.lengthSq()<1e-6)_u.set(1,0,0); _u.normalize();
  _v.crossVectors(_d,_u).normalize();
  const arr=b.geo.attributes.position.array;
  const p1=Math.random()*99, p2=Math.random()*99, f1=3+Math.random()*4, f2=9+Math.random()*7;
  for(let i=0;i<BOLT_SEGS;i++){
    const t=i/(BOLT_SEGS-1), taper=Math.sin(t*Math.PI);
    const o1=Math.sin(t*f1*6.283+p1)*amp*taper, o2=Math.sin(t*f2*6.283+p2)*amp*0.42*taper;
    arr[i*3  ]=_pa.x+_d.x*t+_u.x*o1+_v.x*o2;
    arr[i*3+1]=_pa.y+_d.y*t+_u.y*o1+_v.y*o2;
    arr[i*3+2]=_pa.z+_d.z*t+_u.z*o1+_v.z*o2;
  }
  b.geo.attributes.position.needsUpdate=true;
  b.mat.color.setHex(color||0xbdf0ff);
  b.life=b.max=life||0.22; b.line.visible=true;
}
function updateBolts(dt){
  liveBolts=0;
  for(const b of bolts){
    if(b.life<=0)continue;
    b.life-=dt;
    if(b.life<=0){ b.line.visible=false; b.mat.opacity=0; continue; }
    const k=b.life/b.max;
    b.mat.opacity=k*k*0.95; liveBolts++;
  }
}

/* ---- shockwave rings ---- */
const RING_POOL=10, rings=[];
for(let i=0;i<RING_POOL;i++){
  const m=new THREE.Mesh(new THREE.RingGeometry(0.82,1,48),
    new THREE.MeshBasicMaterial({color:0xa8ecff,transparent:true,opacity:0,side:THREE.DoubleSide,
      blending:THREE.AdditiveBlending,depthWrite:false}));
  m.rotation.x=-Math.PI/2; m.visible=false; scene.add(m);
  rings.push({m,life:0,max:1,to:1,from:0});
}
let ringCursor=0;
function fireRing(x,z,to,life,color,y){
  const r=rings[ringCursor]; ringCursor=(ringCursor+1)%RING_POOL;
  r.m.position.set(x,(y||0)+0.03,z); r.from=0.3; r.to=to;
  r.m.material.color.setHex(color||0xa8ecff);
  r.life=r.max=life||0.55; r.m.visible=true;
}
function updateRings(dt){
  for(const r of rings){
    if(r.life<=0)continue;
    r.life-=dt;
    if(r.life<=0){ r.m.visible=false; continue; }
    const t=1-r.life/r.max;
    const s=r.from+(r.to-r.from)*(1-Math.pow(1-t,2.4));
    r.m.scale.set(s,s,1);
    r.m.material.opacity=(1-t)*0.8;
  }
}

/* ---- sparks: one Points system, burst-spawned ---- */
const SPARKS=420;
const spPos=new Float32Array(SPARKS*3), spVel=new Float32Array(SPARKS*3), spLife=new Float32Array(SPARKS);
const spGeo=new THREE.BufferGeometry();
spGeo.setAttribute('position',new THREE.BufferAttribute(spPos,3));
const sparks=new THREE.Points(spGeo,new THREE.PointsMaterial({color:0xcaf2ff,size:0.075,
  transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));
sparks.frustumCulled=false; scene.add(sparks);
let spCursor=0;
function burst(x,y,z,n,spread,up){
  for(let i=0;i<n;i++){
    const j=spCursor; spCursor=(spCursor+1)%SPARKS;
    spPos[j*3]=x; spPos[j*3+1]=y; spPos[j*3+2]=z;
    const a=Math.random()*6.283, e=Math.random();
    spVel[j*3]=Math.cos(a)*spread*e;
    spVel[j*3+1]=(up||1)*(0.4+Math.random()*1.5);
    spVel[j*3+2]=Math.sin(a)*spread*e;
    spLife[j]=0.34+Math.random()*0.42;
  }
}
function updateSparks(dt){
  for(let i=0;i<SPARKS;i++){
    if(spLife[i]<=0){ if(spPos[i*3+1]>-90)spPos[i*3+1]=-999; continue; }
    spLife[i]-=dt;
    spVel[i*3+1]-=7.5*dt;
    spPos[i*3]+=spVel[i*3]*dt;
    spPos[i*3+1]+=spVel[i*3+1]*dt;
    spPos[i*3+2]+=spVel[i*3+2]*dt;
    if(spPos[i*3+1]<0.02){ spPos[i*3+1]=0.02; spVel[i*3+1]*=-0.3; spVel[i*3]*=.6; spVel[i*3+2]*=.6; }
  }
  spGeo.attributes.position.needsUpdate=true;
}

/* =====================================================================
   TARGETS — something for the axe to hunt, so chaining reads clearly
   ===================================================================== */
const targets=[];
(function(){
  const mat=new THREE.MeshLambertMaterial({color:0x243a58});
  for(let i=0;i<6;i++){
    const a=i/6*6.283+0.4, r=4.1+((i*37)%5)*0.42;
    const m=new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.34,1.20,10),mat);
    m.position.set(Math.cos(a)*r,0.66,Math.sin(a)*r); scene.add(m);
    targets.push({mesh:m,hit:0,home:m.position.clone()});
  }
})();
function jolt(t,power){
  t.hit=1;
  burst(t.mesh.position.x,t.mesh.position.y,t.mesh.position.z,10+power*8,2.4,1);
  fireRing(t.mesh.position.x,t.mesh.position.z,1+power*1.4,0.4,0x9fe8ff);
}
function updateTargets(dt){
  for(const t of targets){
    if(t.hit>0){
      t.hit=Math.max(0,t.hit-dt*3.4);
      const k=t.hit;
      t.mesh.position.y=t.home.y+Math.sin(k*26)*0.10*k;
      t.mesh.rotation.z=Math.sin(k*20)*0.24*k;
    }else{ t.mesh.position.y=t.home.y; t.mesh.rotation.z=0; }
  }
}
function nearestTargets(n){
  return targets.slice().sort((a,b)=>
    a.mesh.position.distanceToSquared(axeRig.position)-
    b.mesh.position.distanceToSquared(axeRig.position)).slice(0,n);
}

/* =====================================================================
   THE COMPANION BRAIN
   Position is a spring-damper chasing an anchor. Because it is under-
   damped it overshoots and settles, which is what makes it read as a
   creature rather than a socket. Orientation slerps toward whatever it
   is currently paying attention to. Scale is its own spring, so growth
   punches past the target and snaps back.
   ===================================================================== */
const P={ radius:1.15, stiff:46, damp:7.0, intensity:1.0, baseScale:1.0 };

const axeVel=new THREE.Vector3();
const anchor=new THREE.Vector3();
const lookQ=new THREE.Quaternion();
const _tmp=new THREE.Vector3(), _tmp2=new THREE.Vector3();
const _YUP=new THREE.Vector3(0,1,0);   // reused: never allocate in the loop

let scaleCur=1, scaleVel=0, scaleTarget=1;
let charge=0, mood='DORMANT', moodTimer=0;
let orbitPhase=0, hoverSide=1;
let attention=null;          // target it is watching
let act=null;                // active move state machine
let twitchIn=2.4;

function setMood(m,hold){ mood=m; moodTimer=Math.max(moodTimer,hold||0.6); }

function idleAnchor(t){
  // hovers off her shoulder, drifting on a slow lissajous so it never
  // sits perfectly still — stillness is what killed the old version
  const base=1.35;
  anchor.set(
    hoverSide*P.radius+Math.sin(t*0.62)*0.13,
    base+Math.sin(t*0.95)*0.15+Math.sin(t*2.3)*0.035,
    Math.sin(t*0.47)*0.20-0.05
  );
  anchor.add(avatar.position);
}

function tickBrain(dt,t){
  // ---------- anchor selection ----------
  if(act) act.anchor(dt,t);
  else{
    idleAnchor(t);
    // idle personality: occasional twitch, and it glances at targets
    twitchIn-=dt;
    if(twitchIn<=0){
      twitchIn=1.8+Math.random()*3.2;
      axeVel.x+=(Math.random()-0.5)*5.5;
      axeVel.y+=Math.random()*3.2;
      axeVel.z+=(Math.random()-0.5)*5.5;
      attention=targets[(Math.random()*targets.length)|0];
      setMood('RESTLESS',1.1);
      if(Math.random()<0.4) fireBolt(axeRig.position.x,axeRig.position.y,axeRig.position.z,
        axeRig.position.x+(Math.random()-.5)*.7, axeRig.position.y+(Math.random()-.5)*.7,
        axeRig.position.z+(Math.random()-.5)*.7, 0.05,0.13,0x8fd8ff);
    }
    scaleTarget=P.baseScale;
  }

  // ---------- position spring ----------
  _tmp.subVectors(anchor,axeRig.position).multiplyScalar(P.stiff);
  axeVel.addScaledVector(_tmp,dt);
  axeVel.multiplyScalar(Math.max(0,1-P.damp*dt));
  axeRig.position.addScaledVector(axeVel,dt);

  // ---------- orientation ----------
  if(act && act.aim) act.aim(dt,t);
  else{
    // blade up, lazily tipped toward whatever it is watching
    _tmp2.set(0,1,0);
    if(attention){
      _tmp.subVectors(attention.mesh.position,axeRig.position).normalize();
      _tmp2.lerp(_tmp,0.30).normalize();
    }
    lookQ.setFromUnitVectors(_YUP,_tmp2);
    axeSpin.quaternion.slerp(lookQ,1-Math.pow(0.001,dt));
    axeSpin.rotateOnAxis(_up, Math.sin(t*0.7)*0.006);
    axeScale.rotation.y+=dt*0.55;         // slow constant menace
  }

  // ---------- scale spring (overshoots on purpose) ----------
  scaleVel+=(scaleTarget-scaleCur)*68*dt;
  scaleVel*=Math.max(0,1-9.5*dt);
  scaleCur+=scaleVel*dt;
  axeScale.scale.setScalar(Math.max(0.05,scaleCur));

  // ---------- energy ----------
  charge += ((act?1:0.16+Math.abs(scaleCur-P.baseScale)*0.5) - charge)*Math.min(1,dt*5);
  const pulse=0.85+Math.sin(t*3.1)*0.06+Math.sin(t*8.3)*0.03;
  matCore.uniforms.uTime.value=t; matHalo.uniforms.uTime.value=t;
  matCore.uniforms.uCharge.value=charge; matHalo.uniforms.uCharge.value=charge;
  matCore.uniforms.uIntensity.value=P.intensity*pulse;
  matHalo.uniforms.uIntensity.value=P.intensity*pulse;
  axeGhost.material.opacity=0.10+charge*0.16;
  axeLight.position.copy(axeRig.position);
  axeLight.intensity=1.2+charge*3.4+scaleCur*0.3;

  // ---------- move state machine ----------
  if(act){
    act.t+=dt;
    act.tick(dt,act.t);
    if(act.t>=act.dur){ if(act.end)act.end(); act=null; setMood('COILED',0.7); }
  }
  moodTimer-=dt;
  if(moodTimer<=0 && !act) mood='WATCHFUL';
}

/* =====================================================================
   MOVES
   Every move is: reposition the anchor, override the aim, spend
   lightning. Growth is used as punctuation, never constantly.
   ===================================================================== */
function flash(a){
  if(REDUCED)return;
  const f=document.getElementById('flash');
  f.style.opacity=a; setTimeout(()=>f.style.opacity=0,70);
}

const MOVES={
  /* quick jab: the axe darts through a target and snaps back */
  arc(){
    const tg=nearestTargets(1)[0];
    const dir=new THREE.Vector3().subVectors(tg.mesh.position,axeRig.position).normalize();
    let struck=false;
    return {dur:0.52,t:0,
      anchor(dt,t){
        const k=this.t/this.dur;
        if(k<0.28){ // wind back
          anchor.copy(tg.mesh.position).addScaledVector(dir,-2.3).setY(1.7);
        }else if(k<0.55){ // lunge through
          anchor.copy(tg.mesh.position).addScaledVector(dir,0.9).setY(1.0);
        }else{ idleAnchor(t*0+performance.now()/1000); }
        scaleTarget=P.baseScale*(k<0.55?1.35:1);
      },
      aim(dt){
        lookQ.setFromUnitVectors(_YUP,dir);
        axeSpin.quaternion.slerp(lookQ,1-Math.pow(0.0005,dt));
        axeScale.rotation.y+=dt*22;
      },
      tick(dt,tt){
        if(tt>0.30&&!struck){
          struck=true; setMood('STRIKING',0.6); jolt(tg,1.1); flash(0.30);
          const p=tg.mesh.position;
          fireBolt(axeRig.position.x,axeRig.position.y,axeRig.position.z,p.x,p.y,p.z,0.22,0.20);
          fireBolt(p.x,p.y+5.5,p.z,p.x,p.y,p.z,0.30,0.22,0xe6faff);
        }
      }};
  },

  /* the signature: axe swells, rears overhead, splits the ground */
  cleave(){
    const tg=nearestTargets(1)[0]; let struck=false;
    return {dur:1.15,t:0,
      anchor(dt,t){
        const k=this.t/this.dur;
        if(k<0.45){ // rise and gather
          anchor.copy(tg.mesh.position); anchor.y=3.5+Math.sin(k*9)*0.16;
          scaleTarget=P.baseScale*2.2; setMood('GATHERING',0.3);
        }else if(k<0.56){ // fall
          anchor.copy(tg.mesh.position); anchor.y=0.45;
        }else{ anchor.copy(tg.mesh.position); anchor.y=1.5;
          scaleTarget=P.baseScale; }
      },
      aim(dt,t){
        lookQ.setFromUnitVectors(_YUP,_up);
        axeSpin.quaternion.slerp(lookQ,1-Math.pow(0.02,dt));
        axeScale.rotation.y+=dt*5;
      },
      tick(dt,tt){
        if(tt<0.5 && Math.random()<dt*22){ // charging arcs into the head
          const p=axeRig.position;
          fireBolt(p.x+(Math.random()-.5)*2.4,p.y+2.2,p.z+(Math.random()-.5)*2.4,
                   p.x,p.y+0.3,p.z,0.18,0.16,0x9fe0ff);
        }
        if(tt>0.56&&!struck){
          struck=true; setMood('CLEAVING',1.0); flash(0.62);
          const p=tg.mesh.position;
          fireRing(p.x,p.z,5.2,0.75,0xdff4ff);
          fireRing(p.x,p.z,3.0,0.55,0x8fd0ff);
          burst(p.x,0.1,p.z,64,4.2,1);
          fireBolt(p.x,p.y+11,p.z,p.x,0.05,p.z,0.55,0.30,0xffffff);
          for(let i=0;i<5;i++){
            const a=i/5*6.283;
            fireBolt(p.x,0.1,p.z,p.x+Math.cos(a)*4.4,0.1,p.z+Math.sin(a)*4.4,0.34,0.26,0xbdf0ff);
          }
          for(const t2 of targets)
            if(t2.mesh.position.distanceTo(p)<5.2) jolt(t2,1.5);
        }
      }};
  },

  /* axe climbs, then whips lightning between everything it can see */
  chain(){
    const list=nearestTargets(5); let i=0, next=0.10;
    return {dur:1.30,t:0,
      anchor(dt,t){
        anchor.set(avatar.position.x,3.1+Math.sin(this.t*5)*0.14,avatar.position.z);
        scaleTarget=P.baseScale*1.5; setMood('SEEKING',0.3);
      },
      aim(dt){ axeSpin.rotateOnAxis(_up,dt*9); axeScale.rotation.x+=dt*3.5; },
      tick(dt,tt){
        if(tt>next && i<list.length){
          const prev = i===0 ? axeRig.position : list[i-1].mesh.position;
          const cur=list[i].mesh.position;
          fireBolt(prev.x,prev.y,prev.z,cur.x,cur.y,cur.z,0.36,0.34,0xd8f4ff);
          jolt(list[i],1.0); flash(0.20);
          i++; next+=0.16;
        }
      }};
  },

  /* it stops pretending to be a weapon and becomes a storm */
  orbit(){
    let ph=0, spark=0;
    return {dur:4.0,t:0,
      anchor(dt,t){
        ph+=dt*4.6;
        const r=2.7;
        anchor.set(avatar.position.x+Math.cos(ph)*r, 1.5+Math.sin(ph*2)*0.42,
                   avatar.position.z+Math.sin(ph)*r);
        scaleTarget=P.baseScale*1.28; setMood('STORMING',0.4);
      },
      aim(dt){ axeScale.rotation.y+=dt*30; axeSpin.rotateOnAxis(_up,dt*2.4); },
      tick(dt,tt){
        spark-=dt;
        if(spark<=0){
          spark=0.075;
          const p=axeRig.position;
          fireBolt(p.x,p.y,p.z,avatar.position.x,1.5,avatar.position.z,0.26,0.16,0x8fd8ff);
          for(const t2 of targets)
            if(t2.mesh.position.distanceTo(p)<2.6){
              fireBolt(p.x,p.y,p.z,t2.mesh.position.x,t2.mesh.position.y,t2.mesh.position.z,
                       0.22,0.14,0xdff4ff);
              if(Math.random()<0.5) jolt(t2,0.7);
            }
        }
      }};
  },

  /* the ultimate: it grows to absurd size and ends the argument */
  ragnarok(){
    let struck=false, pre=0;
    return {dur:2.6,t:0,
      anchor(dt,t){
        const k=this.t/this.dur;
        if(k<0.42){
          anchor.set(avatar.position.x,4.2+k*7.5,avatar.position.z);
          scaleTarget=P.baseScale*5.0; setMood('ASCENDING',0.4);
        }else if(k<0.52){
          anchor.set(avatar.position.x,0.9,avatar.position.z);
        }else{
          anchor.set(avatar.position.x,2.2,avatar.position.z);
          scaleTarget=P.baseScale*(1+(1-Math.min(1,(k-0.52)/0.35))*2.4);
        }
      },
      aim(dt,t){
        lookQ.setFromUnitVectors(_YUP,_up);
        axeSpin.quaternion.slerp(lookQ,1-Math.pow(0.05,dt));
        axeScale.rotation.y+=dt*(this.t<1.1?3:14);
      },
      tick(dt,tt){
        pre-=dt;
        if(tt<1.05&&pre<=0){
          pre=0.06;
          const p=axeRig.position;
          fireBolt(p.x+(Math.random()-.5)*5,p.y+3,p.z+(Math.random()-.5)*5,
                   p.x,p.y,p.z,0.4,0.2,0xa8ecff);
        }
        if(tt>1.10&&!struck){
          struck=true; setMood('RAGNAROK',1.6); flash(0.95);
          const cx=avatar.position.x, cz=avatar.position.z;
          fireBolt(cx,26,cz,cx,0.05,cz,0.9,0.55,0xffffff);
          fireRing(cx,cz,11.5,1.15,0xffffff);
          fireRing(cx,cz,7.5,0.9,0xa8ecff);
          fireRing(cx,cz,4.0,0.7,0xb98cff);
          burst(cx,0.1,cz,180,7.0,1.4);
          for(let i=0;i<9;i++){
            const a=i/9*6.283, r=3+Math.random()*7;
            const x=cx+Math.cos(a)*r, z=cz+Math.sin(a)*r;
            fireBolt(x,16,z,x,0.05,z,0.5,0.42,0xdff4ff);
            fireRing(x,z,2.0,0.5,0xbdf0ff);
          }
          for(const t2 of targets) jolt(t2,2.2);
        }
      }};
  }
};

function provoke(name){
  if(act && act.t<act.dur*0.55) return;   // no move cancelling mid-commit
  act=MOVES[name]();
  hoverSide=Math.random()<0.5?-1:1;
}
document.querySelectorAll('button.mv').forEach(b=>
  b.addEventListener('click',()=>provoke(b.dataset.mv)));

/* =====================================================================
   CAMERA — drag to orbit
   ===================================================================== */
let camYaw=0.55, camPitch=0.20, camDist=8.4, drag=false, lx=0, ly=0;
function camUpdate(){
  const cp=Math.cos(camPitch);
  camera.position.set(Math.sin(camYaw)*cp*camDist, 1.5+Math.sin(camPitch)*camDist, Math.cos(camYaw)*cp*camDist);
  camera.lookAt(0,1.4,0);
}
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',e=>{drag=false;});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  camYaw-=(e.clientX-lx)*0.006;
  camPitch=Math.max(-0.15,Math.min(1.15,camPitch+(e.clientY-ly)*0.005));
  lx=e.clientX; ly=e.clientY;
});
cv.addEventListener('wheel',e=>{e.preventDefault();
  camDist=Math.max(4,Math.min(16,camDist+e.deltaY*0.006));},{passive:false});

/* bars = a crude EEG of how hard the spring is working */
const barEls=[];
{ const c=document.getElementById('bars');
  for(let i=0;i<18;i++){const b=document.createElement('i');c.appendChild(b);barEls.push(b);} }
let barCursor=0;

/* =====================================================================
   LOOP
   ===================================================================== */
const elFps=document.getElementById('tFps'), elObj=document.getElementById('tObj'),
      elBolt=document.getElementById('tBolt'), elMood=document.getElementById('tMood'),
      elScale=document.getElementById('tScale'), elLag=document.getElementById('tLag'),
      elChg=document.getElementById('tChg');
let last=performance.now()/1000, acc=0, frames=0, fps=0, hudAcc=0;

resize(); camUpdate();

function loop(){
  const now=performance.now()/1000;
  let dt=now-last; last=now;
  if(dt>0.05)dt=0.05;

  tickBrain(dt,now);
  updateBolts(dt); updateRings(dt); updateSparks(dt); updateTargets(dt);
  if(!REDUCED) camYaw+=dt*0.012;
  camUpdate();
  renderer.render(scene,camera);

  frames++; acc+=dt; hudAcc+=dt;
  if(acc>=0.5){ fps=Math.round(frames/acc); frames=0; acc=0; }
  if(hudAcc>=0.1){
    hudAcc=0;
    elFps.textContent=fps+' fps';
    elObj.textContent=renderer.info.render.calls+' calls';
    elBolt.textContent=liveBolts+' / '+BOLT_POOL;
    elMood.textContent=mood;
    elScale.textContent=scaleCur.toFixed(2)+'×';
    const lag=axeRig.position.distanceTo(anchor);
    elLag.textContent=lag.toFixed(2);
    elChg.textContent=Math.round(charge*100)+'%';
    barEls[barCursor].style.height=Math.min(100,8+lag*115)+'%';
    barEls[barCursor].style.opacity=0.45+Math.min(0.55,lag*1.5);
    barCursor=(barCursor+1)%barEls.length;
  }
  requestAnimationFrame(loop);
}
loop();
setTimeout(()=>provoke('cleave'),900);
</script>
</body>
</html>
